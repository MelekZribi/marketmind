<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion - MarketMind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0E17; --panel: #131A26; --border: #22303F;
    --text: #E8EDF3; --muted: #6B7A8F; --accent: #E8B44C;
    --font-mono: 'IBM Plex Mono', monospace;
    --font-sans: 'IBM Plex Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font-sans);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  .card {
    width: 100%; max-width: 380px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px; padding: 32px;
  }
  .logo-row { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
  .pulse-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 0 rgba(232, 180, 76, 0.6);
    animation: pulse-glow 2.2s ease-out infinite;
  }
  @keyframes pulse-glow {
    0%   { box-shadow: 0 0 0 0 rgba(232, 180, 76, 0.55); }
    70%  { box-shadow: 0 0 0 8px rgba(232, 180, 76, 0); }
    100% { box-shadow: 0 0 0 0 rgba(232, 180, 76, 0); }
  }
  h1 { font-family: var(--font-mono); font-size: 20px; margin: 0; font-weight: 600; letter-spacing: 0.5px; }
  .accent { color: var(--accent); }
  p.sub { color: var(--muted); font-size: 13px; margin: 8px 0 24px 17px; }
  label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; font-family: var(--font-mono); }
  input {
    width: 100%; background: #0A0E17; border: 1px solid var(--border);
    color: var(--text); padding: 11px 12px; border-radius: 8px;
    font-size: 14px; font-family: var(--font-sans); margin-bottom: 16px; outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232, 180, 76, 0.12); }
  button {
    width: 100%; background: var(--accent); color: #1A1305; border: none;
    padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px;
    font-family: var(--font-sans); transition: filter 0.15s ease;
  }
  button:hover { filter: brightness(1.08); }
  .flash { background: #3a1c1c; color: #ffb3b3; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
  .footer-link { text-align: center; margin-top: 18px; font-size: 13px; color: var(--muted); }
  .footer-link a { color: var(--accent); text-decoration: none; }
  .footer-link a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="card">
  <div class="logo-row">
    <span class="pulse-dot"></span>
    <h1>Market<span class="accent">Mind</span></h1>
  </div>
  <p class="sub">Connecte-toi pour retrouver tes discussions.</p>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST">
    <label>Nom d'utilisateur</label>
    <input type="text" name="username" required autofocus>
    <label>Mot de passe</label>
    <input type="password" name="password" required>
    <button type="submit">Se connecter</button>
  </form>

  <div class="footer-link">Pas encore de compte ? <a href="{{ url_for('auth.register') }}">Inscris-toi</a></div>
</div>
</body>
</html>
